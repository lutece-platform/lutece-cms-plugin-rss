<@chList class='rss-feeds'>
<#list rss_feeds_list![] as rss>
	<@chItem>
		<@cBlock><#if (rss.url!'')?matches('^https?://.*')><@cLink href=rss.url label=rss.name! /><#else>${rss.name!}</#if></@cBlock>
		<@cBlock><#outputformat "HTML">${rss.url!}</#outputformat></@cBlock>
	</@chItem>
</#list>
</@chList>
